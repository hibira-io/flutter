name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed packages example/lib
      - run: flutter analyze packages example
      - run: dart test
        working-directory: packages/hibira
      - run: flutter test
        working-directory: packages/hibira_push
      - run: dart pub publish --dry-run
        working-directory: packages/hibira
      - run: flutter pub publish --dry-run
        working-directory: packages/hibira_push

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter build apk --debug
        working-directory: example

  e2e:
    runs-on: ubuntu-latest
    if: vars.HIBIRA_E2E_KEY != ''
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - run: dart pub get
      - run: dart test test/e2e_test.dart
        working-directory: packages/hibira
        env:
          HIBIRA_E2E_HOST: ws.hibira.io
          HIBIRA_E2E_PORT: 443
          HIBIRA_E2E_TLS: true
          HIBIRA_E2E_APP_ID: ${{ vars.HIBIRA_E2E_APP_ID }}
          HIBIRA_E2E_KEY: ${{ vars.HIBIRA_E2E_KEY }}
          HIBIRA_E2E_SECRET: ${{ secrets.HIBIRA_E2E_SECRET }}
