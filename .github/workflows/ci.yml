name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed packages example/lib flutterflow
      - run: flutter analyze packages example flutterflow
      - run: flutter test
        working-directory: flutterflow
      - run: dart test
        working-directory: packages/hibira
      - run: flutter test
        working-directory: packages/hibira_push
      - run: flutter test
        working-directory: packages/hibira_inbox
      - run: dart pub publish --dry-run
        working-directory: packages/hibira
      - run: flutter pub publish --dry-run
        working-directory: packages/hibira_push
      - run: flutter pub publish --dry-run
        working-directory: packages/hibira_inbox

  # The packages declare flutter: ">=3.32.0", so check they still analyze and
  # pass their tests on that release, not only on the latest stable.
  # macOS, because hibira_push is Swift Package Manager only and Flutter 3.32
  # only resolves SPM plugins where Xcode is installed.
  test-min-flutter:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.32.0
          channel: stable
          cache: true
      # SPM is off by default on 3.32.
      - run: flutter config --enable-swift-package-manager
      - run: flutter pub get
      - run: flutter analyze packages example flutterflow
      - run: flutter test
        working-directory: flutterflow
      - run: flutter test
        working-directory: packages/hibira_push
      - run: flutter test
        working-directory: packages/hibira_inbox

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true
      - run: flutter build apk --debug
        working-directory: example

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true
      # hibira_push pulls hibira-push-ios as a Swift package.
      - run: flutter config --enable-swift-package-manager
      - run: flutter build ios --simulator --debug
        working-directory: example

  e2e:
    runs-on: ubuntu-latest
    if: vars.HIBIRA_E2E_KEY != ''
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dart-lang/setup-dart@2286a0c042b44434fe26d292bbce8d34f7ec662b # v1
      - run: dart pub get
      - run: dart test test/e2e_test.dart
        working-directory: packages/hibira
        env:
          HIBIRA_E2E_HOST: ws.hibira.io
          HIBIRA_E2E_PORT: 443
          HIBIRA_E2E_TLS: true
          HIBIRA_E2E_APP_ID: ${{ vars.HIBIRA_E2E_APP_ID }}
          HIBIRA_E2E_KEY: ${{ vars.HIBIRA_E2E_KEY }}
          HIBIRA_E2E_SECRET: ${{ secrets.HIBIRA_E2E_SECRET }}
