include: package:flutter_lints/flutter.yaml

analyzer:
  errors:
    # FlutterFlow puts the same import block on top of every custom code
    # file, so most files leave some of it unused.
    unused_import: ignore
    # FlutterFlow names widget parameters and files itself.
    file_names: ignore
    # The FlutterFlow import block uses package:flutter/material.dart, which
    # Flutter 3.47 deprecated in favour of material_ui. FlutterFlow writes
    # that block itself and it must not be edited.
    deprecated_member_use: ignore
