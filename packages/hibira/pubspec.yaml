name: hibira
description: >-
  Pusher Channels protocol client in pure Dart for Hibira and other
  Pusher-compatible servers. Public, private, presence, encrypted and
  server-to-user channels on Flutter, the web and the Dart VM.
version: 0.1.1
homepage: https://hibira.io
repository: https://github.com/hibira-io/flutter/tree/main/packages/hibira
issue_tracker: https://github.com/hibira-io/flutter/issues
topics:
  - websocket
  - realtime
  - pusher
  - presence
  - chat

environment:
  sdk: ^3.8.0

resolution: workspace

dependencies:
  http: ^1.2.0
  pinenacl: ^0.6.0
  web_socket_channel: ^3.0.0

dev_dependencies:
  crypto: ^3.0.0
  fake_async: ^1.3.0
  lints: ^6.0.0
  test: ^1.25.0
