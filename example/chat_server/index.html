<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hibira chat</title>
<script src="https://js.pusher.com/8.4.0/pusher.min.js"></script>
<style>
  body { font: 16px system-ui, sans-serif; max-width: 640px; margin: 0 auto; padding: 24px; color: #1c1b1f; }
  #log { display: flex; flex-direction: column; gap: 8px; min-height: 360px; }
  .msg { align-self: flex-start; background: #f1f0f4; padding: 8px 12px; border-radius: 12px; }
  .msg.me { align-self: flex-end; background: #e0e0ff; }
  #typing { height: 24px; color: #6b6a70; font-size: 14px; }
  form { display: flex; gap: 8px; }
  input { flex: 1; font: inherit; padding: 10px 12px; border: 1px solid #c9c7ce; border-radius: 8px; }
  button { font: inherit; padding: 10px 18px; border: 0; border-radius: 20px; background: #4f46e5; color: #fff; }
</style>
</head>
<body>
<h2 id="status">Joining…</h2>
<div id="log"></div>
<div id="typing"></div>
<form id="form"><input id="input" placeholder="Message" autocomplete="off"><button>Send</button></form>
<script>
  const user = new URLSearchParams(location.search).get('user') || 'Leo';
  const pusher = new Pusher('YOUR_APP_KEY', {
    wsHost: 'ws.hibira.io', forceTLS: true, enabledTransports: ['ws', 'wss'], cluster: '',
    channelAuthorization: { endpoint: '/hibira/auth?user=' + encodeURIComponent(user) },
  });
  const room = pusher.subscribe('presence-chat');
  const $ = (id) => document.getElementById(id);
  const name = (id) => room.members.get(id)?.info.name ?? id;
  const show = (from, text, me) => {
    const div = document.createElement('div');
    div.className = 'msg' + (me ? ' me' : '');
    div.textContent = from + ': ' + text;
    $('log').append(div);
  };
  const count = () => { $('status').textContent = room.members.count + ' in the room'; };
  room.bind('pusher:subscription_succeeded', count);
  room.bind('pusher:member_added', count);
  room.bind('pusher:member_removed', count);
  let timeout;
  room.bind('client-message', (data, meta) => {
    show(name(meta.user_id), data.text, false);
    $('typing').textContent = '';
  });
  room.bind('client-typing', (data, meta) => {
    $('typing').textContent = name(meta.user_id) + ' is typing…';
    clearTimeout(timeout);
    timeout = setTimeout(() => { $('typing').textContent = ''; }, 3000);
  });
  let last = 0;
  $('input').addEventListener('input', () => {
    if (Date.now() - last < 2000) return;
    last = Date.now();
    room.trigger('client-typing', {});
  });
  $('form').addEventListener('submit', (e) => {
    e.preventDefault();
    const text = $('input').value.trim();
    if (!text) return;
    room.trigger('client-message', { text });
    show(user, text, true);
    $('input').value = '';
    last = 0;
  });
</script>
</body>
</html>
